<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Times App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="time.js"></script>
</head>

<body class="bg-blue-200">
    <header class="w-full max-w-4xl mx-auto px-6 py-4
               flex items-center justify-between
               bg-white dark:bg-slate-900
               text-slate-900 dark:text-white
               rounded-2xl shadow-lg m-10">

    <!-- الوقت -->
    <div class="text-2xl font-bold">
        <span id="currentTime">12:45 PM</span>
    </div>

    <!-- زر تغيير الوضع -->
    <button id="themeToggle"
    class="w-14 h-8 rounded-full
           bg-slate-300 dark:bg-slate-700
           relative transition-all duration-300">

    <span id="themeIcon"
        class="absolute left-1 top-1
               w-6 h-6 rounded-full
               bg-white shadow-md
               transition-all duration-500
               flex items-center justify-center">
        ☀️
    </span>
    <span id="themeIcon"
        class="absolute right-1 top-1
               w-6 h-6 rounded-full
               bg-white shadow-md
               transition-all duration-500
               flex items-center justify-center invisible">
        🌙
    </span>

</button>

</header>
  <!--the name of contry-->
  <div class="flex items-center justify-center  ">

    <div class="bg-white rounded-2xl p-8 shadow-lg text-center w-full max-w-4xl h-[230px] pt-20 pb-20 mb-10">

        <p class="text-3xl font-bold text-blue-600">
            First line of text
        </p>

        <p class="text-lg text-red-600 mt-2">
            Second line of text
        </p>

    </div>

</div>
   <!--the page pr-->
   <div class="flex items-center justify-center  ">

    <div class="w-96 bg-white rounded-2xl border-2 border-red-500 p-8 shadow-lg w-full max-w-4xl mb-10">

        <div class="flex flex-col gap-4 text-center">

            <p class="text-3xl font-bold text-blue-600">
                First line
            </p>

            <p class="text-xl text-red-600">
                Second line
            </p>

            <p class="text-lg text-gray-600">
                Third line
            </p>

        </div>

    </div>

</div>
<!--next part-->
<div class="flex items-center justify-center  ">

    <div class="w-96 bg-white rounded-2xl border-2 border-red-500 p-8 shadow-lg w-full max-w-4xl mb-10">

        <div class="flex flex-col gap-4 text-center">

            <p class="text-3xl font-bold text-blue-600">
              TODAY'S PRAYERS
            </p>
        </div>
    </div>
</div>
<!--bsfore last pasrt-->
<div class="flex items-center justify-center">
<div class="grid grid-cols-2 gap-3 w-full max-w-md items-center justify-center ">

    <!-- Row 1 -->
    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
        Item 1
    </div>

    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
        Item 2
    </div>

    <!-- Row 2 -->
    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
        Item 3
    </div>

    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
        Item 4
    </div>

    <!-- Row 3 -->
    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
        Item 5
    </div>

    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
        Item 6
    </div>

    <!-- Row 4 -->
    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
        Item 7
    </div>

    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
        Item 8
    </div>

    <!-- Row 5 -->
    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
        Item 9
    </div>

    <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
        Item 10
    </div>

</div>
</div>
<!--buttom card-->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2
            w-full max-w-4xl
            h-16
            bg-white dark:bg-slate-900
            shadow-2xl
            rounded-t-3xl
            flex items-center justify-between
            px-8">

    <!-- Left button -->
    <button class="text-2xl hover:scale-110 transition-transform duration-300">
        🏠
    </button>

    <!-- Right button -->
    <button class="text-2xl hover:scale-110 transition-transform duration-300">
        ⚙️
    </button>

</div>
</body>

</html>
